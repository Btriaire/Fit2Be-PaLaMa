name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Même commande que le déploiement Vercel : tsc -b (plus strict que tsc --noEmit) puis build.
      - run: npm run build
      - run: npm run lint
      - run: npm test
